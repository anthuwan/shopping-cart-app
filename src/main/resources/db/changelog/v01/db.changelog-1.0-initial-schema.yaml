databaseChangeLog:
  - changeSet:
      id: 1-create-client-table
      author: capco
      changes:
        - createTable:
            tableName: client
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_client
                    nullable: false
              - column:
                  name: client_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_client_client_id
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: company_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: vat_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: registration_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: annual_revenue
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: true

  - changeSet:
      id: 2-create-product-table
      author: capco
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_product
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_product_code
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: base_price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: true

  - changeSet:
      id: 3-create-shopping-cart-table
      author: capco
      changes:
        - createTable:
            tableName: shopping_cart
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_shopping_cart
                    nullable: false
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shopping_cart
            baseColumnNames: client_id
            constraintName: fk_shopping_cart_client
            referencedTableName: client
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 4-create-shopping-cart-item-table
      author: capco
      changes:
        - createTable:
            tableName: shopping_cart_item
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_shopping_cart_item
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shopping_cart_item
            baseColumnNames: cart_id
            constraintName: fk_cart_item_cart
            referencedTableName: shopping_cart
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: shopping_cart_item
            baseColumnNames: product_id
            constraintName: fk_cart_item_product
            referencedTableName: product
            referencedColumnNames: id
            onDelete: RESTRICT

  - changeSet:
      id: 5-insert-sample-products
      author: capco
      changes:
        - insert:
            tableName: product
            columns:
              - column:
                  name: code
                  value: HIGH_END_PHONE
              - column:
                  name: name
                  value: High-end Phone
              - column:
                  name: base_price
                  valueNumeric: 1500.00
        - insert:
            tableName: product
            columns:
              - column:
                  name: code
                  value: MID_RANGE_PHONE
              - column:
                  name: name
                  value: Mid-range Phone
              - column:
                  name: base_price
                  valueNumeric: 800.00
        - insert:
            tableName: product
            columns:
              - column:
                  name: code
                  value: LAPTOP
              - column:
                  name: name
                  value: Laptop
              - column:
                  name: base_price
                  valueNumeric: 1200.00
